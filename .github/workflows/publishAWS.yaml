name: "Publish Docker image to AWS ECR and deploy to ECS"

on:
  push:
    branches:
      - dev
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      cancel-in-progress: true

    env:
      IS_PROD: ${{ github.event_name == 'release' }}
      # Prod on GitHub Release; preprod on push to dev
      AWS_ROLE: ${{ github.event_name == 'release' && secrets.AWS_ROLE__main || secrets.AWS_ROLE__dev }}
      AWS_REGION: ${{ github.event_name == 'release' && secrets.AWS_REGION__main || secrets.AWS_REGION__dev }}
      ECR_REPOSITORY: ${{ github.event_name == 'release' && secrets.ECR_REPOSITORY__main || secrets.ECR_REPOSITORY__dev }}
      ECS_CLUSTER: ${{ github.event_name == 'release' && secrets.ECS_CLUSTER__main || secrets.ECS_CLUSTER__dev }}
      ECS_SERVICE: ${{ github.event_name == 'release' && secrets.ECS_SERVICE__main || secrets.ECS_SERVICE__dev }}
      STATUS_REPORT_TOKEN: ${{ secrets.STATUS_REPORT_TOKEN }}
      STATUS_REPORT_URL: ${{ secrets.STATUS_REPORT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set image tags
        run: |
          if [[ "$IS_PROD" == "true" ]]; then
            echo "TAGNAME=latest" >> $GITHUB_ENV
            echo "VERSION_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            CLEAN_TAG=${GITHUB_REF#refs/heads/}
            CLEAN_TAG=${CLEAN_TAG//\//_}
            echo "TAGNAME=$CLEAN_TAG" >> $GITHUB_ENV
            echo "VERSION_TAG=" >> $GITHUB_ENV
          fi

      # Preprod only: show pending changesets in About → Change Log (NEWS.md).
      # Does not consume changesets or bump the version; not used on prod releases.
      - name: Inject Unreleased NEWS from changesets
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/changeset-unreleased.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: GitHub-to-AWS
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        run: |
          ECR_URI=$(aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "Using ECR URI: $ECR_URI"
          echo "Using tag: $TAGNAME"
          docker build --no-cache \
            ${STATUS_REPORT_TOKEN:+--build-arg STATUS_REPORT_TOKEN="$STATUS_REPORT_TOKEN"} \
            ${STATUS_REPORT_URL:+--build-arg STATUS_REPORT_URL="$STATUS_REPORT_URL"} \
            -t $ECR_REPOSITORY:$TAGNAME .
          docker tag $ECR_REPOSITORY:$TAGNAME $ECR_URI:$TAGNAME
          docker push $ECR_URI:$TAGNAME

          if [[ -n "$VERSION_TAG" ]]; then
            echo "Also tagging image as: $VERSION_TAG"
            docker tag $ECR_REPOSITORY:$TAGNAME $ECR_URI:$VERSION_TAG
            docker push $ECR_URI:$VERSION_TAG
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Delete all untagged images from ECR
        run: |
          UNTAGGED_DIGESTS=$(aws ecr list-images \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*].imageDigest' \
            --output text)

          if [ -z "$UNTAGGED_DIGESTS" ]; then
            echo "No untagged images to delete."
          else
            for digest in $UNTAGGED_DIGESTS; do
              echo "Deleting untagged image with digest: $digest"
              aws ecr batch-delete-image \
                --repository-name $ECR_REPOSITORY \
                --region $AWS_REGION \
                --image-ids imageDigest=$digest
            done
          fi
